# Baut die Seite jede Stunde neu und veröffentlicht sie über GitHub Pages.
name: Seite aktualisieren

on:
  schedule:
    - cron: "17,47 * * * *"   # alle 30 Minuten (Minute 17 und 47); GitHub startet oft verspätet
  workflow_dispatch:         # Knopf "Run workflow" für sofortiges Update
  push:
    branches: [main]

permissions:
  contents: write   # Archiv der Meldungen speichern
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Quellen abrufen und Seite bauen
        run: python build.py

      - name: Archiv der Meldungen speichern
        run: |
          git config user.name "veedel-bot"
          git config user.email "veedel-bot@users.noreply.github.com"
          git add data/meldungen.json
          git diff --cached --quiet || (git commit -m "Meldungen aktualisiert" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
